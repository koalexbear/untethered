[package]
name = "untethered-iced"
version = "0.1.0"
edition = "2024"
default-run = "untethered-iced"
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22"
async-channel = "2"
async-lock = "3"
bs58 = "0.5"
chrono = "0.4"
futures-util = "0.3"
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.7"
bytes = "1"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wgpu", "tokio", "x11", "wayland", "advanced", "image-without-codecs", "canvas"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "fs", "net"] }
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
# Optional matrix-rust-sdk engine, selected at runtime with
# UNTETHERED_ENGINE=matrix-sdk (see docs/matrix-sdk-migration.md). The SDK's
# default TLS feature brings in aws-lc-rs next to the ring provider that
# livekit and reqwest 0.12 already use, so take reqwest 0.13 without a
# provider and install ring when the engine starts.
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite"] }
matrix-sdk-ui = { version = "0.19.1", default-features = false }
reqwest-sdk = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.9.2"
livekit = { version = "=0.12.0", features = ["rustls-tls-native-roots"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
smithay-clipboard = "0.7.3"
ashpd = { version = "0.11.1", default-features = false, features = ["tokio"] }
libc = "0.2"

[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "webgl", "fira-sans", "advanced", "image-without-codecs", "canvas"] }
imagesize = { version = "0.14", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "ErrorEvent", "MessageEvent", "Document", "Window", "Navigator", "Clipboard", "File", "FileList"] }
js-sys = "0.3"

[profile.dev]
debug = 0
