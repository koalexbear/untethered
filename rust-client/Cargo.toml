[package]
name = "untethered-iced"
version = "0.1.0"
edition = "2024"
default-run = "untethered-iced"
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22"
async-channel = "2"
async-lock = "3"
bs58 = "0.5"
chrono = "0.4"
futures-util = "0.3"
serde_json = "1"
url = "2"
# The matrix-sdk engine's typed boundary, also across the browser worker.
serde = { version = "1", features = ["derive"] }
# MIME types for uploads on the matrix-sdk engine (engine/media.rs).
mime = "0.3"
# Clocks that also work in browsers (std::time::Instant panics on wasm32).
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.7"
bytes = "1"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wgpu", "tokio", "x11", "wayland", "advanced", "image-without-codecs", "canvas"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "fs", "net"] }
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
# Optional matrix-rust-sdk engine, selected at runtime with
# UNTETHERED_ENGINE=matrix-sdk (see docs/matrix-sdk-migration.md). The SDK's
# default TLS feature brings in aws-lc-rs next to the ring provider that
# livekit and reqwest 0.12 already use, so take reqwest 0.13 without a
# provider and install ring when the engine starts.
matrix-sdk = { version = "0.20.0", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "markdown", "experimental-send-custom-to-device"] }
matrix-sdk-ui = { version = "0.20.0", default-features = false }
reqwest-sdk = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The matrix-sdk store passphrase in the OS keyring (engine/keyring.rs).
keyring-core = "1"
# CollectStrategy for Olm-encrypted call keys (engine/calls.rs); matrix-sdk
# doesn't re-export it.
matrix-sdk-crypto = { version = "0.20.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.9.2"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
livekit = { version = "=0.12.0", features = ["rustls-tls-native-roots"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
smithay-clipboard = "0.7.3"
ashpd = { version = "0.11.1", default-features = false, features = ["tokio"] }
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# SDK logs for the opt-in live tests (UNTETHERED_QA_LOG / UNTETHERED_QA_LOG_FILE).
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "webgl", "fira-sans", "advanced", "image-without-codecs", "canvas"] }
imagesize = { version = "0.14", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The matrix-sdk engine sizes uploads and makes their thumbnails, as on the desktop.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
# The matrix-sdk engine in a browser worker (docs/matrix-sdk-migration.md,
# step 7): IndexedDB stores and the browser's fetch instead of SQLite and TLS.
matrix-sdk = { version = "0.20.0", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "indexeddb", "js", "markdown"] }
matrix-sdk-ui = { version = "0.20.0", default-features = false, features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "ErrorEvent", "MessageEvent", "Document", "Window", "Navigator", "Clipboard", "File", "FileList", "Storage", "Location", "DedicatedWorkerGlobalScope"] }
js-sys = "0.3"

[profile.dev]
debug = 0

# Unoptimized, the matrix-sdk engine's store key derivation (200,000 PBKDF2
# rounds per store), Olm/Megolm and SQLite take many seconds: a debug client
# needed most of a minute to sign in. The call fixtures run debug builds for
# their QA hooks, so optimize just these dependencies.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.vodozemac]
opt-level = 3
[profile.dev.package.matrix-sdk-store-encryption]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
