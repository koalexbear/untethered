[package]
name = "untethered-rtc-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
futures-util = "0.3"
livekit = "=0.12.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
getrandom = "0.3"
base64 = "0.22"
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"

[profile.dev]
debug = 0
